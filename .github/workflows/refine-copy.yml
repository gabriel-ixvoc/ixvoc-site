name: Refine IXVOC copy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine text only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
            'IXVOς — Sites de Alta Conversão': 'IXVOC — Sites de Alta Conversão',
            'A IXVOς transforma sua presença digital em um sistema previsível de aquisição de clientes.': 'A IXVOC transforma sua presença digital em um sistema claro de aquisição de clientes.',
            'IXVO<span class="sigma">ς</span>': 'IXVOC',
            'IXVOς': 'IXVOC',
            'Seu site não deveria ser um panfleto digital. Deveria ser <strong>o seu melhor vendedor</strong> — trabalhando 24 horas por dia, sem folga, sem desculpa. <em>É isso que construímos.</em>': 'Site bonito não basta. A IXVOC cria páginas que explicam rápido, geram confiança e levam o cliente para a ação.',
            'Ver o que está te travando': 'Ver onde você perde venda',
            'A gente sabe exatamente <br>o que está <span class="hlr">te travando</span>.': 'Seu digital está <br><span class="hlr">vazando venda</span>.',
            'Escolha a frase que mais parece com a sua realidade. Vamos te mostrar a raiz do problema — e exatamente como resolvemos.': 'Escolha sua maior dor. A resposta aparece na hora, sem enrolação.',
            'Você não precisa de mais um site bonito. <br>Você precisa de <span>um sistema que traz cliente todo dia.</span>': 'Não é sobre ter mais um site. <br>É sobre transformar visita em cliente.',
            'Três motivos pelos quais <br>seu digital não performa.': 'Três pontos onde <br>seu digital perde dinheiro.',
            'Passe o mouse em cada card para ver o outro lado. Todo problema aqui tem solução — e ela é a nossa especialidade.': 'Veja onde o resultado costuma escapar — e como corrigimos.',
            'Visual impecável, zero vendas. Sem hierarquia, sem gatilhos, sem jornada pensada. O visitante entra, não entende o que você faz em 5 segundos, e vai embora para o concorrente.': 'Bonito, mas confuso. Se o cliente não entende rápido, ele sai.',
            'Cada pixel tem um propósito. Estruturamos a jornada do visitante com UX focado em conversão — CTA no lugar certo e copy que derruba as objeções antes delas nascerem.': 'Organizamos a página para explicar, criar confiança e gerar ação.',
            'Você investe em anúncios e manda o clique para uma página fraca. É encher um balde furado. O problema nunca foi o anúncio — foi o destino dele.': 'Anúncio bom em página fraca vira custo, não crescimento.',
            'Landing pages de alta performance integradas à estratégia de tráfego, com rastreamento de conversão real. Você para de comprar clique e passa a comprar cliente.': 'Ligamos campanha, página e conversão para medir o que vende.',
            'Seu concorrente aparece no Google, tem identidade consistente e transmite confiança. Você passa despercebido — e perde o cliente antes de dizer uma palavra.': 'Quem aparece primeiro e passa confiança ganha antes da conversa.',
            'Branding profissional, SEO técnico para aparecer quando importa e identidade que diz "somos referência" antes do cliente ler a primeira linha do seu site.': 'Ajustamos presença, marca e SEO para você ser encontrado e levado a sério.',
            'Cada serviço existe para <br>resolver <span class="hl">um problema real</span>.': 'Serviços diretos para <br><span class="hl">problemas reais</span>.',
            'Clique em qualquer card para ver o problema que ele resolve e o que você recebe na prática.': 'Clique e veja o que muda na prática.',
            'Por que você já tentou antes <br>e <span class="hlr">não deu certo</span>.': 'Menos promessa. <br><span class="hlr">Mais clareza</span>.',
            'Se você já contratou alguém e se frustrou, provavelmente reconhece a coluna da esquerda.': 'O que muda quando o projeto nasce para vender e ser medido.',
            'Entrega um site bonito e some depois do "no ar".': 'Entrega o site e some depois do “no ar”.',
            'Relatório cheio de gráfico que não responde "quantos clientes vieram".': 'Mostra gráfico, mas não mostra cliente.',
            'Anúncio rodando sem rastreamento de conversão configurado.': 'Roda anúncio sem medir conversão.',
            'Template genérico adaptado, igual ao do concorrente.': 'Usa template com cara de genérico.',
            'Promessa de resultado sem explicar como chegaria lá.': 'Promete resultado sem plano claro.',
            'Você fica sem saber em que pé está o projeto.': 'Você precisa cobrar atualização.',
            'Contrato longo que prende antes de provar valor.': 'Prende antes de provar valor.',
            'O lançamento é o começo: monitoramos e otimizamos depois do ar.': 'O lançamento é o começo da otimização.',
            'Relatório em linguagem de dono: quanto entrou, de onde veio, quanto custou.': 'Lead, origem e custo aparecem com clareza.',
            'Rastreamento de conversão configurado antes do primeiro real investido.': 'Conversão configurada antes da mídia.',
            'Projeto construído do zero para o seu mercado e o seu cliente.': 'Página feita para seu mercado e seu cliente.',
            'Estratégia explicada em detalhe: você entende cada decisão.': 'Você entende cada decisão importante.',
            'Etapas visíveis e prazo claro do briefing à entrega.': 'Etapas e prazos visíveis.',
            'Sem fidelidade. Ficamos porque o resultado justifica.': 'Sem fidelidade forçada.',
            'Cada etapa existe por uma razão. Nada aqui é burocracia — tudo move o seu projeto para frente.': 'Um processo simples para tirar o digital do improviso.',
            'Entendemos seu negócio, público e concorrência. Mapeamos exatamente onde você perde cliente hoje e definimos a jornada ideal do seu visitante.': 'Mapeamos onde você perde cliente e qual caminho precisa existir.',
            'Cada seção do seu site ganha uma razão de existir. Definimos onde o visitante entra, o que vê, o que sente e onde converte — antes de escrever uma linha de código.': 'Definimos oferta, seções e CTAs antes do design.',
            'Identidade visual que transmite confiança instantânea. Tipografia, hierarquia, cor e microinterações pensadas para vender, não só para agradar.': 'Visual forte, legível e pensado para conversão.',
            'Código limpo, carregamento rápido, responsivo em todo dispositivo. Core Web Vitals no verde e analytics configurado antes do go live.': 'Site rápido, responsivo e pronto para medir conversões.',
            'Go live com monitoramento ativo. Analisamos dados reais, identificamos gargalos e otimizamos mês a mês. Porque um bom site nunca está pronto.': 'Publicamos, medimos e ajustamos com dados reais.',
            'Não prometemos milagre. Prometemos processo, clareza e presença — as três coisas que faltaram da última vez.': 'O básico bem feito: clareza, prazo e responsabilidade.',
            'Você sabe exatamente o que será entregue, quando e por quanto — antes de assinar. Sem custo surpresa no meio do caminho.': 'Você sabe entrega, prazo e valor antes de começar.',
            'Nenhuma campanha sobe sem conversão configurada. Se não dá para medir, não dá para otimizar — e nós não trabalhamos no escuro.': 'Campanha só sobe com conversão configurada.',
            'Canal direto com quem executa o seu projeto. Sem ticket, sem intermediário, sem sumiço depois do contrato assinado.': 'Canal direto, sem sumiço depois do contrato.',
            'Quantos contatos entraram, de onde vieram e quanto custou cada um. Métrica de dono, não vaidade de agência.': 'Você vê contatos, origem e custo por lead.',
            'Domínio, contas de anúncio, analytics e código são seus. Você nunca fica refém de ninguém — nem da gente.': 'Domínio, contas e código ficam no seu nome.',
            'Você continua porque quer, não porque assinou. Nossa retenção é consequência de resultado, não de cláusula.': 'Você continua se fizer sentido, não por obrigação.',
            'IXVOC é mais do que um nome — é um compromisso. Em grego, significa <em>pegada</em>. E é exatamente isso que construímos para cada cliente: uma presença digital que deixa marca, que é lembrada, que converte.': 'IXVOC nasceu para unir estratégia, design e dados em páginas que deixam marca e geram ação.',
            'Nascemos da união de estratégia com tecnologia, de design com dados. Sem achismo, sem site genérico. Cada projeto é tratado como se fosse o nosso próprio negócio — porque sabemos que o seu site pode mudar a sua empresa.': 'Sem site genérico, sem achismo. Cada decisão precisa ajudar o cliente a entender, confiar e chamar.',
            'Não fazemos sites. Fazemos a sua pegada digital.': 'Não fazemos site bonito. Fazemos presença que vende.',
            'Descubra onde seu negócio <br>está <span class="hlr">perdendo dinheiro</span> online.': 'Veja onde seu site <br><span class="hlr">perde dinheiro</span>.',
            '8 perguntas. 2 minutos. Um diagnóstico completo com o seu gargalo principal, oportunidades imediatas e o que fazer agora.': '8 perguntas rápidas. No final, você recebe o próximo passo.',
            'Tudo que você queria saber <br>antes de contratar.': 'Perguntas antes <br>de começar.',
            'Vamos criar sua <br><span>pegada digital.</span>': 'Vamos transformar <br><span>visita em cliente.</span>',
            'Conte sobre seu projeto. Em até 24h você recebe uma proposta personalizada, com escopo e prazo claros — sem compromisso e sem enrolação.': 'Conte seu cenário. A IXVOC responde com caminho, prazo e investimento.',
            'Agência digital focada em performance e resultado real. Sua pegada no mundo digital começa aqui.': 'Sites, tráfego e estratégia para vender melhor online.',
            'Feito com obsessão por conversão': 'Feito para converter',
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          # Keep the large hero wordmark exactly as it was.
          s = s.replace('aria-label="IXVOC"', 'aria-label="IXVOς"')
          s = s.replace('<h1 class="hwm" aria-label="IXVOς">\n        <span class="ltr" style="--i:0">I</span><span class="ltr" style="--i:1">X</span><span class="ltr" style="--i:2">V</span><span class="ltr" style="--i:3">O</span><span class="ltr sigma" style="--i:4">ς</span>\n      </h1>', '<h1 class="hwm" aria-label="IXVOς">\n        <span class="ltr" style="--i:0">I</span><span class="ltr" style="--i:1">X</span><span class="ltr" style="--i:2">V</span><span class="ltr" style="--i:3">O</span><span class="ltr sigma" style="--i:4">ς</span>\n      </h1>')

          Path('.github/workflows/refine-copy.yml').unlink(missing_ok=True)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit refined copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/refine-copy.yml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refine IXVOC text copy"
            git push
          fi
